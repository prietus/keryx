site_name: Keryx
site_url: https://keryx.priet.us
site_description: A native IRC client for macOS, with full IRCv3 and first-class soju support.
site_author: Carlos Prieto
repo_url: https://github.com/prietus/keryx
repo_name: prietus/keryx
copyright: © 2026 Carlos Prieto · Apache 2.0

docs_dir: docs
site_dir: build

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Configuration:
      - Networks: configuration/networks.md
      - Settings: configuration/settings.md
  - Features:
      - Reading: features/reading.md
      - Writing: features/writing.md
      - Mentions and notifications: features/mentions.md
      - soju: features/soju.md
      - Channel operators: features/operators.md
      - Themes: features/themes.md
      - Now Playing (/np): features/now-playing.md
      - Scripts (/exec): features/scripts.md
  - Commands: commands.md
  - Keyboard shortcuts: shortcuts.md
  - IRCv3: ircv3.md
  - FAQ: faq.md
